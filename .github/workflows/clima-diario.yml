name: Recolha diária de clima (IPMA e SNIRH)

on:
  schedule:
    # todos os dias às 05:37 UTC (05:37 em Lisboa no inverno, 06:37 no verão)
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      snirh_completo:
        description: "Voltar a pedir ao SNIRH a série completa desde 1990"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/onr_clima_recolha.py"
      - ".github/workflows/clima-diario.yml"

permissions:
  contents: write

concurrency:
  group: clima-diario
  cancel-in-progress: false

jobs:
  recolha:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install --quiet requests openpyxl

      # 1. IPMA primeiro e gravado logo, para que um problema no SNIRH nunca faça perder dias do IPMA
      - name: Recolher IPMA
        timeout-minutes: 15
        run: python scripts/onr_clima_recolha.py --sem-snirh

      - name: Gravar IPMA
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/clima
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Clima IPMA: recolha de $(date -u +%Y-%m-%d)"
            git pull --rebase --quiet
            git push
          fi

      # 2. SNIRH depois, com limite de tempo; se falhar não falha a execução
      - name: Recolher SNIRH
        timeout-minutes: 25
        continue-on-error: true
        run: |
          if [ "${{ inputs.snirh_completo }}" = "true" ]; then
            python scripts/onr_clima_recolha.py --so-snirh --snirh-completo --orcamento-snirh 20
          else
            python scripts/onr_clima_recolha.py --so-snirh --orcamento-snirh 20
          fi

      - name: Gravar SNIRH
        if: always()
        run: |
          git add dados/clima
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Clima SNIRH: recolha de $(date -u +%Y-%m-%d)"
            git pull --rebase --quiet
            git push
          fi
